[package]
name = "terminalert"
version = "0.1.0"
edition = "2024"
# Set by let chains (`if let … && let …`), stable in edition 2024 since 1.88.
rust-version = "1.88"
description = "Reminders for the terminal: tables of tasks, half calendar and half to-do list, and which are due now"
license = "GPL-3.0-only"

[features]
default = ["cli"]
# The command-line front end: clap, and terminal_choice's forms for marking tasks. Library users
# can opt out with `default-features = false`.
cli = ["dep:clap", "dep:terminal_choice"]

[[bin]]
name = "terminalert"
path = "src/main.rs"
required-features = ["cli"]

# Runs the binary, which only a `cli` build has.
[[test]]
name = "cli"
required-features = ["cli"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"], optional = true }
# Cron as crontab writes it: reading a pattern, and the dates it names — on jiff, not chrono.
croner = { version = "4.0.3", default-features = false, features = ["jiff"] }
jiff = "0.2.39"
serde = { version = "1.0.229", features = ["derive"] }
terminal_choice = { git = "https://github.com/SirHexa10t/terminal_choice.git", branch = "main", optional = true }
thiserror = "2"
toml = "1.2"
